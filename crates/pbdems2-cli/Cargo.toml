[package]
name = "pbdems2-cli"
version = "0.2.0"
edition = "2024"
rust-version = "1.88.0"
description = "Command-line inspector for Source 2 PBDEMS2 demo files"
license = "MIT"
publish = false

[[bin]]
name = "pbdems2"
path = "src/main.rs"
doc = false

[dependencies]
clap = { version = "4.6.0", features = ["derive"] }
pbdems2 = { path = "../..", features = ["mmap"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

[dev-dependencies]
snap = "1.1.1"
tempfile = "3.27.0"

[lints]
workspace = true
