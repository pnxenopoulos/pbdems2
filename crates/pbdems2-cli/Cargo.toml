[package]
name = "pbdems2-cli"
version = "0.3.2"
edition = "2024"
rust-version = "1.88.0"
description = "Command-line inspector for Source 2 PBDEMS2 demo files"
license = "MIT"
publish = false

[[bin]]
name = "pbdems2"
path = "src/main.rs"
doc = false

[dependencies]
clap = { version = "4.6.0", features = ["derive"] }
pbdems2 = { workspace = true, features = ["mmap"] }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
snap.workspace = true
tempfile.workspace = true

[lints]
workspace = true
