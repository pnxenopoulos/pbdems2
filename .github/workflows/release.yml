name: Release pbdems2

on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  ci-gate:
    name: Verify release commit
    runs-on: ubuntu-latest
    permissions:
      checks: read
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Require the main branch
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != refs/heads/main ]; then
            echo "Releases can only be dispatched from main (got $REF)"
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Require successful CI for the release commit
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          result=$(gh api "repos/$REPOSITORY/commits/$COMMIT_SHA/check-runs" --jq '.check_runs[] | select(.name == "CI Check") | .conclusion')
          if [ "$result" != success ]; then
            echo "CI Check has not passed on $COMMIT_SHA (result: ${result:-not found})"
            exit 1
          fi

      - name: Read the package version
        id: version
        run: |
          version=$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "pbdems2") | .version')
          echo "Releasing pbdems2 $version from $GITHUB_SHA"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Require an unused tag
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          TAG_NAME: v${{ steps.version.outputs.version }}
        run: |
          tagged_sha=$(gh api "repos/$REPOSITORY/git/ref/tags/$TAG_NAME" --jq .object.sha 2>/dev/null || true)
          if [ -z "$tagged_sha" ]; then
            echo "$TAG_NAME is available."
          elif [ "$tagged_sha" = "$COMMIT_SHA" ]; then
            echo "$TAG_NAME already points at $COMMIT_SHA; the tag step will be a no-op."
          else
            echo "$TAG_NAME already exists on $tagged_sha; bump the version in Cargo.toml before releasing."
            exit 1
          fi

  publish:
    name: Publish pbdems2
    needs: ci-gate
    runs-on: ubuntu-latest
    environment: crates
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Detect a published baseline
        id: baseline
        run: |
          if curl -fsS -A "pbdems2-release" -o /dev/null "https://crates.io/api/v1/crates/pbdems2"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "This is the first pbdems2 release; compatibility check is not applicable."
          fi

      - name: Check the public API against crates.io
        if: steps.baseline.outputs.exists == 'true'
        uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          package: pbdems2
          feature-group: all-features

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          VERSION: ${{ needs.ci-gate.outputs.version }}
        run: |
          if curl -fsS -A "pbdems2-release" -o /dev/null "https://crates.io/api/v1/crates/pbdems2/$VERSION"; then
            echo "pbdems2 $VERSION is already published; skipping."
          else
            cargo publish --locked
          fi

  tag:
    name: Tag the release
    needs: [ci-gate, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create the release tag
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          TAG_NAME: v${{ needs.ci-gate.outputs.version }}
        run: |
          tagged_sha=$(gh api "repos/$REPOSITORY/git/ref/tags/$TAG_NAME" --jq .object.sha 2>/dev/null || true)
          if [ "$tagged_sha" = "$COMMIT_SHA" ]; then
            echo "$TAG_NAME already points at $COMMIT_SHA; nothing to do."
            exit 0
          fi
          if [ -n "$tagged_sha" ]; then
            echo "$TAG_NAME already exists on $tagged_sha; refusing to move it."
            exit 1
          fi
          gh api "repos/$REPOSITORY/git/refs" \
            -f ref="refs/tags/$TAG_NAME" \
            -f sha="$COMMIT_SHA" > /dev/null
          echo "Tagged $COMMIT_SHA as $TAG_NAME"
