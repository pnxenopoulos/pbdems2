name: Release pbdems2

on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  ci-gate:
    name: Verify release commit
    runs-on: ubuntu-latest
    permissions:
      checks: read
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Require the main branch
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != refs/heads/main ]; then
            echo "Releases can only be dispatched from main (got $REF)"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Require successful CI for the release commit
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          result=$(gh api "repos/$REPOSITORY/commits/$COMMIT_SHA/check-runs" --jq '.check_runs[] | select(.name == "CI Check") | .conclusion')
          if [ "$result" != success ]; then
            echo "CI Check has not passed on $COMMIT_SHA (result: ${result:-not found})"
            exit 1
          fi

      - name: Read the package version
        id: version
        run: |
          version=$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "pbdems2") | .version')
          echo "Releasing pbdems2 $version from $GITHUB_SHA"
          cli_version=$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "pbdems2-cli") | .version')
          if [ "$cli_version" != "$version" ]; then
            echo "pbdems2-cli $cli_version does not match pbdems2 $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Require an unused tag
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          TAG_NAME: v${{ steps.version.outputs.version }}
        run: |
          if response=$(gh api "repos/$REPOSITORY/git/ref/tags/$TAG_NAME" --jq .object.sha 2>&1); then
            if [ "$response" = "$COMMIT_SHA" ]; then
              echo "$TAG_NAME already points at $COMMIT_SHA; the tag step will be a no-op."
            else
              echo "$TAG_NAME already exists on $response; bump the version in Cargo.toml before releasing."
              exit 1
            fi
          elif printf '%s\n' "$response" | grep -q 'HTTP 404'; then
            echo "$TAG_NAME is available."
          else
            printf '%s\n' "$response" >&2
            echo "Could not determine whether $TAG_NAME already exists."
            exit 1
          fi

  publish:
    name: Publish pbdems2
    needs: [ci-gate, build-cli]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Detect a published baseline
        id: baseline
        run: |
          if curl -fsS -A "pbdems2-release" -o /dev/null "https://crates.io/api/v1/crates/pbdems2"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "This is the first pbdems2 release; compatibility check is not applicable."
          fi

      - name: Check the public API against crates.io
        if: steps.baseline.outputs.exists == 'true'
        uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          package: pbdems2
          feature-group: all-features

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          VERSION: ${{ needs.ci-gate.outputs.version }}
        run: |
          if curl -fsS -A "pbdems2-release" -o /dev/null "https://crates.io/api/v1/crates/pbdems2/$VERSION"; then
            echo "pbdems2 $VERSION is already published; skipping."
          else
            cargo publish --locked
          fi

  build-cli:
    name: Build CLI (${{ matrix.target }})
    needs: ci-gate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build the CLI
        run: cargo build --locked --release -p pbdems2-cli --target ${{ matrix.target }}

      - name: Smoke-test the CLI
        if: runner.os != 'Windows'
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.ci-gate.outputs.version }}
        run: |
          output=$("target/$TARGET/release/pbdems2" --version)
          test "$output" = "pbdems2 $VERSION"

      - name: Smoke-test the CLI
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.ci-gate.outputs.version }}
        run: |
          $output = & "target/$env:TARGET/release/pbdems2.exe" --version
          if ($LASTEXITCODE -ne 0) {
            throw "pbdems2 --version exited with $LASTEXITCODE"
          }
          if ($output -ne "pbdems2 $env:VERSION") {
            throw "unexpected version output: $output"
          }

      - name: Package the CLI
        if: runner.os != 'Windows'
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.ci-gate.outputs.version }}
        run: |
          archive="pbdems2-v$VERSION-$TARGET"
          mkdir -p "stage/$archive" dist
          install -m 755 "target/$TARGET/release/pbdems2" "stage/$archive/pbdems2"
          cp LICENSE README.md "stage/$archive/"
          tar -C stage -czf "dist/$archive.tar.gz" "$archive"
          (cd dist && shasum -a 256 "$archive.tar.gz" > "$archive.tar.gz.sha256")

      - name: Package the CLI
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.ci-gate.outputs.version }}
        run: |
          $archive = "pbdems2-v$env:VERSION-$env:TARGET"
          New-Item -ItemType Directory -Force -Path "stage/$archive", dist | Out-Null
          Copy-Item "target/$env:TARGET/release/pbdems2.exe" "stage/$archive/pbdems2.exe"
          Copy-Item LICENSE, README.md "stage/$archive/"
          Compress-Archive -Path "stage/$archive" -DestinationPath "dist/$archive.zip"
          $hash = (Get-FileHash -Algorithm SHA256 "dist/$archive.zip").Hash.ToLowerInvariant()
          "$hash  $archive.zip" | Set-Content -Encoding ascii "dist/$archive.zip.sha256"

      - name: Upload the CLI archive
        uses: actions/upload-artifact@v4
        with:
          name: pbdems2-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  tag:
    name: Tag the release
    needs: [ci-gate, publish, build-cli]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create the release tag
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          TAG_NAME: v${{ needs.ci-gate.outputs.version }}
        run: |
          tagged_sha=$(gh api "repos/$REPOSITORY/git/ref/tags/$TAG_NAME" --jq .object.sha 2>/dev/null || true)
          if [ "$tagged_sha" = "$COMMIT_SHA" ]; then
            echo "$TAG_NAME already points at $COMMIT_SHA; nothing to do."
            exit 0
          fi
          if [ -n "$tagged_sha" ]; then
            echo "$TAG_NAME already exists on $tagged_sha; refusing to move it."
            exit 1
          fi
          gh api "repos/$REPOSITORY/git/refs" \
            -f ref="refs/tags/$TAG_NAME" \
            -f sha="$COMMIT_SHA" > /dev/null
          echo "Tagged $COMMIT_SHA as $TAG_NAME"
  github-release:
    name: Publish GitHub release
    needs: [ci-gate, tag, build-cli]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download CLI archives
        uses: actions/download-artifact@v5
        with:
          pattern: pbdems2-*
          path: dist
          merge-multiple: true

      - name: Create combined checksums
        run: cat dist/*.sha256 | sort > dist/SHA256SUMS

      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG_NAME: v${{ needs.ci-gate.outputs.version }}
          VERSION: ${{ needs.ci-gate.outputs.version }}
        run: |
          if gh release view "$TAG_NAME" --repo "$REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG_NAME" dist/* --clobber --repo "$REPOSITORY"
          else
            gh release create "$TAG_NAME" dist/* \
              --verify-tag \
              --title "pbdems2 $VERSION" \
              --generate-notes \
              --repo "$REPOSITORY"
          fi
