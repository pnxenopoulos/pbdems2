name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: Format, Clippy, rustdoc, and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          key: lint-stable

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Check the minimal feature set
        run: cargo check -p pbdems2 --no-default-features --locked

      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --all-features --locked

      - name: Test documentation
        run: cargo test --workspace --doc --all-features --locked

      - name: Verify release package
        run: cargo package --locked

  dependencies:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  semver:
    name: Public API compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Detect a published baseline
        id: baseline
        run: |
          if curl -fsS -A "pbdems2-ci" -o /dev/null "https://crates.io/api/v1/crates/pbdems2"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No published pbdems2 release exists yet; compatibility check is not applicable."
          fi

      - name: Check the public API against crates.io
        if: steps.baseline.outputs.exists == 'true'
        uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          package: pbdems2
          feature-group: all-features

  test:
    name: Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux stable
            os: ubuntu-latest
            toolchain: stable
          - name: Linux MSRV
            os: ubuntu-latest
            toolchain: 1.88.0
          - name: macOS stable
            os: macos-latest
            toolchain: stable
          - name: Windows stable
            os: windows-latest
            toolchain: stable

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.toolchain }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: test-${{ matrix.os }}-${{ matrix.toolchain }}

      - uses: taiki-e/install-action@v2.85.3
        with:
          tool: nextest

      - name: Run tests
        run: cargo nextest run --workspace --all-features --locked --profile ci

      - name: Check all targets
        run: cargo check --workspace --all-targets --all-features --locked

  benchmarks:
    name: Compile benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: benchmarks-stable

      - name: Compile every benchmark target
        run: cargo bench -p pbdems2-bench --no-run --locked

  coverage:
    name: Coverage (minimum 75% lines)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2
        with:
          key: coverage-stable

      - uses: taiki-e/install-action@v2.85.3
        with:
          tool: |
            nextest
            cargo-llvm-cov

      - name: Clean stale coverage data
        run: cargo llvm-cov clean --workspace

      - name: Instrument and run the full test suite
        run: cargo coverage

      - name: Enforce the line-coverage floor
        run: cargo coverage-report | tee coverage-summary.txt

      - name: Export LCOV
        run: cargo coverage-lcov

      - name: Upload coverage data
        uses: actions/upload-artifact@v7
        with:
          name: pbdems2-coverage
          path: |
            coverage-summary.txt
            lcov.info
          retention-days: 14

  ci-success:
    name: CI Check
    if: always()
    needs: [lint, dependencies, semver, test, benchmarks, coverage]
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI job
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          DEPENDENCY_RESULT: ${{ needs.dependencies.result }}
          BENCHMARK_RESULT: ${{ needs.benchmarks.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          SEMVER_RESULT: ${{ needs.semver.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          test "$LINT_RESULT" = success
          test "$DEPENDENCY_RESULT" = success
          test "$COVERAGE_RESULT" = success
          test "$SEMVER_RESULT" = success
          test "$TEST_RESULT" = success
          test "$BENCHMARK_RESULT" = success
