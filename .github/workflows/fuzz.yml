name: Fuzz

on:
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - src/**
      - fuzz/**
      - .github/workflows/fuzz.yml
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - src/**
      - fuzz/**
      - .github/workflows/fuzz.yml
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Compile fuzz targets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz -> target
          key: fuzz-nightly

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      - name: Compile every fuzz target
        run: cargo fuzz build

  campaign:
    name: Fuzz ${{ matrix.target }}
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        target:
          - command_stream
          - bitreader
          - field_paths
          - serializers
          - string_tables
          - packet_entities
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz -> target
          key: fuzz-${{ matrix.target }}-nightly

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      - name: Run bounded campaign
        run: cargo fuzz run ${{ matrix.target }} -- -max_total_time=300 -rss_limit_mb=4096
