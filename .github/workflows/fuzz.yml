name: Fuzz

on:
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - src/**
      - fuzz/**
      - .github/workflows/fuzz.yml
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - src/**
      - fuzz/**
      - .github/workflows/fuzz.yml
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # A toolchain file outranks the `rustup default` that the toolchain action
  # sets, so rust-toolchain.toml would win and `-Zsanitizer` would be rejected.
  RUSTUP_TOOLCHAIN: nightly
  # Prebuilt cargo-fuzz binaries are musl-linked, which makes their built-in
  # default target musl; instrumented builds have to target the glibc host.
  FUZZ_TARGET_TRIPLE: x86_64-unknown-linux-gnu

jobs:
  build:
    name: Compile fuzz targets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz -> target
          key: fuzz-nightly

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      - name: Compile every fuzz target
        run: cargo fuzz build --target "$FUZZ_TARGET_TRIPLE"

  campaign:
    name: Fuzz ${{ matrix.target }}
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        target:
          - command_stream
          - bitreader
          - field_paths
          - serializers
          - string_tables
          - packet_entities
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz -> target
          key: fuzz-${{ matrix.target }}-nightly

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      - name: Run bounded campaign
        env:
          FUZZ_TARGET: ${{ matrix.target }}
        run: cargo fuzz run "$FUZZ_TARGET" --target "$FUZZ_TARGET_TRIPLE" -- -max_total_time=300 -rss_limit_mb=4096
